<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 48 48"
  fill="none"
  role="img"
  aria-label="Continuum Patient Support agent"
>
  <title>Continuum Patient Support</title>

  <!-- Chat bubble body — rounded rectangle -->
  <path
    d="M6 8 C6 5.8 7.8 4 10 4 L38 4 C40.2 4 42 5.8 42 8 L42 30 C42 32.2 40.2 34 38 34 L16 34 L9 42 L9 34 L10 34 C7.8 34 6 32.2 6 30 Z"
    stroke="#0E7C86"
    stroke-width="2.5"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- CGM glucose waveform inside bubble — matches ContinuumLogo inner-curve style -->
  <path
    d="M14 22 Q18 14 22 18 Q26 22 30 16 Q32 13 34 15"
    stroke="#0E7C86"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Spark / star motif — top-right corner of bubble (common "spark" across agent family) -->
  <!-- Vertical ray -->
  <line x1="37" y1="8" x2="37" y2="12" stroke="#0E7C86" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Horizontal ray -->
  <line x1="35" y1="10" x2="39" y2="10" stroke="#0E7C86" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Diagonal rays -->
  <line x1="35.6" y1="8.6" x2="38.4" y2="11.4" stroke="#0E7C86" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="38.4" y1="8.6" x2="35.6" y2="11.4" stroke="#0E7C86" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Centre dot — sensor reading indicator (echoes ContinuumLogo circle) -->
  <circle cx="22" cy="18" r="1.8" fill="#0E7C86"/>
</svg>
