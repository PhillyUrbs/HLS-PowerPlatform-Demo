# Tier-1 CI — fast PR checks (target ~60–90s budget per Topic 11 §C4)
#
# This workflow runs on every PR to main and on direct pushes to main.
# Each job is intentionally small + parallel so total wall-clock stays under budget.
#
# Status today: **skeleton**. Jobs without code to check exit 0 cleanly with `# TODO:`
# comments pointing to the relevant Topic / Sitting for the implementer.
#
# Tester (the role) owns this workflow. Real check implementations land as the codebase
# grows. Tester measures actual runtime once content exists; if > 120s, demote
# `audit-permissions` and `axe-core` to a Tier-1.5 / touched-folder-only split.
#
# Required-status-check job names are stable (don't rename) — branch protection
# references them explicitly.

name: Tier-1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tier1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # PR-metadata checks (fast; run on PRs only)
  # ─────────────────────────────────────────────────────────────

  branch-naming:
    name: Branch naming (feature/p<N>-<name>)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 1
    steps:
      - name: Lint branch name (warning only — soft gate per Topic 10)
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -eu
          echo "Branch: $BRANCH"
          # Allow main + feature/p<N>-<kebab-name>; warn (don't fail) on other patterns.
          if [[ "$BRANCH" =~ ^feature/p[0-6]-[a-z0-9-]+$ ]]; then
            echo "::notice::Branch name matches feature/p<N>-<name> convention."
          elif [[ "$BRANCH" == "main" ]]; then
            echo "::notice::PR from main — skipping branch naming check."
          else
            echo "::warning::Branch '$BRANCH' does not match feature/p[0-6]-<name>. See Topic 11 §C9."
          fi

  conventional-commits:
    name: Conventional Commits (PR title)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 1
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          echo "PR title: $TITLE"
          # Conventional Commits: type(scope)?: description
          # Common types: feat, fix, chore, docs, refactor, test, perf, build, ci, style, revert
          # Squash-merge uses PR title as commit message, so we lint it (not commit history).
          if [[ "$TITLE" =~ ^(feat|fix|chore|docs|refactor|test|perf|build|ci|style|revert)(\([a-z0-9_/-]+\))?(!)?:\ .+ ]]; then
            echo "::notice::PR title matches Conventional Commits."
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(p2-pages): add registration form'."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # Repo-state checks (fast; always run)
  # ─────────────────────────────────────────────────────────────

  agents-md-presence:
    name: AGENTS.md presence (root + 7 subfolders)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - name: Verify all required AGENTS.md files exist
        run: |
          set -eu
          required=(
            "AGENTS.md"
            "solutions/ContinuumHealthDemo/AGENTS.md"
            "apps/field-companion/AGENTS.md"
            "sites/continuum-portal/AGENTS.md"
            "agents/AGENTS.md"
            "scripts/AGENTS.md"
            "data/AGENTS.md"
            "docs/AGENTS.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ -f "$f" ]]; then
              echo "✓ $f"
            else
              echo "::error file=$f::Required AGENTS.md missing (Topic 10B locks 8 total)."
              missing=$((missing+1))
            fi
          done
          if [[ $missing -gt 0 ]]; then
            exit 1
          fi

  phase-json-valid:
    name: phase.json validity
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - name: Validate .squad/phase.json shape
        run: |
          set -eu
          if [[ ! -f .squad/phase.json ]]; then
            echo "::error::.squad/phase.json missing."
            exit 1
          fi
          # Check required keys exist (using node since jq is fine on ubuntu but node is universal here).
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync(".squad/phase.json", "utf8"));
            const required = ["currentPhase","currentPhaseName","phaseStartedAt","allowedFolders","warningFolders","completionChecklist"];
            const missing = required.filter(k => !(k in p));
            if (missing.length) {
              console.error("::error::phase.json missing required keys: " + missing.join(", "));
              process.exit(1);
            }
            if (typeof p.currentPhase !== "number" || p.currentPhase < 0 || p.currentPhase > 6) {
              console.error("::error::phase.json currentPhase must be 0–6.");
              process.exit(1);
            }
            console.log("✓ phase.json valid (currentPhase=" + p.currentPhase + " — " + p.currentPhaseName + ")");
          '

  decisions-md-shape:
    name: decisions.md entry-shape lint
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - name: Lint .squad/decisions.md heading shape
        run: |
          set -eu
          if [[ ! -f .squad/decisions.md ]]; then
            echo "::error::.squad/decisions.md missing."
            exit 1
          fi
          # Each Active Decision entry must use heading shape: ## YYYY-MM-DD — <Title>
          # We tolerate other ## headings ("Active Decisions", "Governance", etc.) but
          # any ## starting with a date prefix must follow the locked shape.
          bad=$(grep -nE '^## [0-9]{4}-[0-9]{2}-[0-9]{2}' .squad/decisions.md | grep -vE '^[0-9]+:## [0-9]{4}-[0-9]{2}-[0-9]{2} — .+$' || true)
          if [[ -n "$bad" ]]; then
            echo "::error::decisions.md entries must match '## YYYY-MM-DD — <Title>' (em-dash, not hyphen). Bad headings:"
            echo "$bad"
            exit 1
          fi
          count=$(grep -cE '^## [0-9]{4}-[0-9]{2}-[0-9]{2} — ' .squad/decisions.md || true)
          echo "✓ decisions.md heading shape OK ($count date-prefixed entries)."

  phase-folder-warning:
    name: Phase-folder warning (soft gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn if PR touches warningFolders for current phase
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          phase=$(node -p 'JSON.parse(require("fs").readFileSync(".squad/phase.json","utf8")).currentPhase')
          phase_name=$(node -p 'JSON.parse(require("fs").readFileSync(".squad/phase.json","utf8")).currentPhaseName')
          warning_folders=$(node -e 'const w=JSON.parse(require("fs").readFileSync(".squad/phase.json","utf8")).warningFolders; console.log(w.join("\n"));')
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || git diff --name-only "${BASE_REF}...HEAD" 2>/dev/null || echo "")
          if [[ -z "$changed" ]]; then
            echo "::notice::No file changes detected (or unable to compute diff)."
            exit 0
          fi
          flagged=""
          for folder in $warning_folders; do
            matches=$(echo "$changed" | grep -F "$folder" || true)
            if [[ -n "$matches" ]]; then
              flagged+="  $folder:\n$(echo "$matches" | sed 's/^/    /')\n"
            fi
          done
          if [[ -n "$flagged" ]]; then
            echo "::warning::PR touches files outside Phase $phase ($phase_name) allowed scope. Cross-cutting changes are OK; just confirm with Lead and add a decisions.md entry. Flagged paths:"
            printf "%b" "$flagged"
          else
            echo "::notice::All changes within Phase $phase allowed scope."
          fi

  # ─────────────────────────────────────────────────────────────
  # Secret scan (fast; gitleaks is ~5–15s)
  # ─────────────────────────────────────────────────────────────

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Default ruleset; project-specific allow-list TBD if false positives appear.

  # ─────────────────────────────────────────────────────────────
  # Stub jobs — content lands in subsequent sittings/phases.
  # Each exits 0 today so the workflow is green on first PR.
  # Job names are stable; branch protection references them.
  # ─────────────────────────────────────────────────────────────

  lint-format-types:
    name: Lint + Prettier + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stub
        run: |
          # TODO Tester (Sitting 4+): add ESLint + Prettier + tsc once apps/ + sites/ scaffolds exist.
          # See Topic 7 §A11y (jsx-a11y) + Topic 11 §C4 (budget).
          echo "::notice::Stub — no JS/TS code yet. Returning success."

  json-yaml-md-lint:
    name: JSON / YAML / Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Stub
        run: |
          # TODO Tester: wire ajv-cli (JSON Schema), yaml-lint, markdownlint-cli2.
          # JSON schemas to validate when present:
          #   - .squad/phase.json against .squad/phase.schema.json (already done in phase-json-valid job)
          #   - scripts/deployment-settings.json against deployment-settings.schema.json (Sitting 4)
          #   - scripts/lib/EnvVarManifest.json (Sitting 4)
          #   - scripts/lib/AgentToolContract.schema.json instances (Phase 4)
          #   - scripts/lib/TelemetryPayload.schema.json instances (Phase 4)
          echo "::notice::Stub — JSON/YAML/MD lint TBD."

  powershell-syntax:
    name: PowerShell syntax + PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Stub
        run: |
          # TODO Tester (Sitting 4): add PSScriptAnalyzer once scripts/ has .ps1 files.
          # Verify scripts default to --whatif; verify Resolve-Secret is used for secret access.
          echo "::notice::Stub — no .ps1 files yet. Returning success."

  solution-structure:
    name: Solution structure + migration order
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Stub
        run: |
          # TODO Dataverse-Engineer + Tester (Phase 1): verify
          #   - cch_ prefix on every solution object
          #   - persona-attribution columns on audit-relevant tables
          #   - migrations numbered, no gaps, declare destructive in header
          #   - all flows use Connection References + Environment Variables
          echo "::notice::Stub — no solution unpacked yet. Returning success."

  audit-permissions:
    name: audit-permissions (Pages PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if no Pages changes
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a PR — skipping."
            exit 0
          fi
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || git diff --name-only "${BASE_REF}...HEAD" 2>/dev/null || echo "")
          if echo "$changed" | grep -qE '^sites/continuum-portal/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No sites/continuum-portal/ changes — skipping."
          fi
      - name: Stub
        if: steps.scope.outputs.run == 'true'
        run: |
          # TODO Pages-Engineer + Governance (Phase 2): wire the audit-permissions
          # Power Platform skill against the deployed Pages site or the YAML in repo.
          # See Topic 3 lock + Topic 8B knowledge ACL extension.
          echo "::notice::Stub — Pages content TBD. Returning success."

  test-a11y-vitest:
    name: A11y axe (Vitest, hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if no React changes
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || git diff --name-only "${BASE_REF}...HEAD" 2>/dev/null || echo "")
          if echo "$changed" | grep -qE '^(apps|sites)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No apps/ or sites/ changes — skipping."
          fi
      - name: Set up Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            sites/continuum-portal/package-lock.json
            apps/field-companion/package-lock.json
      - name: Install continuum-portal deps
        if: steps.scope.outputs.run == 'true'
        working-directory: sites/continuum-portal
        run: npm ci
      - name: Run a11y axe tests (sites/continuum-portal)
        if: steps.scope.outputs.run == 'true'
        working-directory: sites/continuum-portal
        run: |
          # Hard gate on AA violations per Topic 7 lock.
          npm run test:a11y
      - name: Install field-companion deps
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/field-companion
        run: npm ci
      - name: Run a11y axe tests (apps/field-companion)
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/field-companion
        run: |
          # Hard gate on AA violations per Topic 7 lock.
          npm run test:a11y

  schema-drift:
    name: Schema-drift validators (telemetry + agent envelope)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Stub
        run: |
          # TODO Tester (Phase 4): validate every logTelemetry call site against
          # scripts/lib/TelemetryPayload.schema.json (Topic 6) and every tool flow's
          # input/output binding against scripts/lib/AgentToolContract.schema.json (Topic 8C).
          echo "::notice::Stub — no telemetry/tool code yet. Returning success."

  # ─────────────────────────────────────────────────────────────
  # Aggregator — branch protection points at this single check.
  # Adding/removing real checks above doesn't require updating
  # branch protection settings.
  # ─────────────────────────────────────────────────────────────

  tier1-summary:
    name: Tier-1 summary
    runs-on: ubuntu-latest
    needs:
      - branch-naming
      - conventional-commits
      - agents-md-presence
      - phase-json-valid
      - decisions-md-shape
      - phase-folder-warning
      - secret-scan
      - lint-format-types
      - json-yaml-md-lint
      - powershell-syntax
      - solution-structure
      - audit-permissions
      - test-a11y-vitest
      - schema-drift
    if: always()
    timeout-minutes: 1
    steps:
      - name: Aggregate dependency results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -eu
          # Fail this aggregator if any required upstream job's result is 'failure' or 'cancelled'.
          # 'success' and 'skipped' both pass (skipped means the job's `if:` filter excluded it).
          echo "$NEEDS_JSON" | node -e '
            let raw = "";
            process.stdin.on("data", c => raw += c);
            process.stdin.on("end", () => {
              const needs = JSON.parse(raw);
              const failed = Object.entries(needs).filter(([_, v]) => v.result === "failure" || v.result === "cancelled");
              for (const [name, v] of Object.entries(needs)) {
                console.log(`  ${v.result.padEnd(10)} ${name}`);
              }
              if (failed.length) {
                console.error("::error::Tier-1 failed: " + failed.map(([n]) => n).join(", "));
                process.exit(1);
              }
              console.log("✓ Tier-1 summary: all required jobs passed (or were skipped per scope filter).");
            });
          '
